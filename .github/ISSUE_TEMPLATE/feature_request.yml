name: Feature request
description: Suggest an improvement or a new feature
title: "[Feature]: "
labels: ["enhancement"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Please describe the problem first, then the solution you have in mind.
        PRISM does not add game-memory access, process injection or anti-cheat bypasses.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      placeholder: "I want to..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Crosshair editor
        - Presets and profiles
        - Overlay behavior
        - Hotkeys
        - Appearance and themes
        - Localization
        - Performance
        - Packaging and installer
        - Other

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: This does not require reading game memory or injecting into a game.
          required: true
        - label: I searched existing issues for a similar request.
          required: true
